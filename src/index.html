<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/">

  <!--
    Title, description, canonical, Open Graph, Twitter and JSON-LD structured data are
    generated by SeoService and baked into this file at build time (prerendering).
    The values below are fallbacks only.
  -->
  <title>Chirag Jain | Assistant Vice President at Delta Capita</title>
  <meta name="description" content="Chirag Jain, Assistant Vice President at Delta Capita: 7+ years building fast, accessible web platforms with Angular and TypeScript.">
  <link rel="canonical" href="https://chiragj.pro/">

  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a192f">
  <meta name="format-detection" content="telephone=no">
  <meta name="google" content="notranslate">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192x192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="sitemap" type="application/xml" href="sitemap.xml">
  <link rel="me" href="https://github.com/chirag8966">
  <link rel="me" href="https://www.linkedin.com/in/chirag8966/">

  <!-- Critical fonts: fetched in parallel with CSS/JS so text renders in the final font -->
  <link rel="preload" href="assets/fonts/Calibre/Calibre-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/Calibre/Calibre-Semibold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/SFMono/SFMono-Regular.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Applies the saved theme before first paint (no flash). Dark is the default; prerendered HTML is dark. -->
  <script>
    (function () {
      var t = 'dark';
      try { if (localStorage.getItem('theme') === 'light') t = 'light'; } catch (e) {}
      var d = document.documentElement;
      d.dataset.theme = t;
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', t === 'light' ? '#f7f5f0' : '#0a192f');
      var c = document.querySelector('meta[name="color-scheme"]');
      if (c) c.setAttribute('content', t);
    })();
  </script>

  <style>
    /* Prevents a white flash before the app styles load */
    html, body { background: #0a192f; margin: 0; }
    html[data-theme="light"], html[data-theme="light"] body { background: #f7f5f0; }
    /* Above-the-fold font faces + metric-matched fallbacks, available at first paint (no CLS on swap) */
    @font-face { font-family: 'Calibre'; font-weight: 400; font-style: normal; font-display: swap; src: url('/assets/fonts/Calibre/Calibre-Regular.woff2') format('woff2'); }
    @font-face { font-family: 'Calibre'; font-weight: 600; font-style: normal; font-display: swap; src: url('/assets/fonts/Calibre/Calibre-Semibold.woff2') format('woff2'); }
    @font-face { font-family: 'SF Mono'; font-weight: 400; font-style: normal; font-display: swap; src: url('/assets/fonts/SFMono/SFMono-Regular.woff2') format('woff2'); }
    @font-face { font-family: 'Calibre Fallback'; font-weight: 100 500; src: local('Arial'), local('ArialMT'), local('Liberation Sans'), local('Helvetica Neue'), local('Roboto'); size-adjust: 86.85%; ascent-override: 74.84%; descent-override: 40.3%; line-gap-override: 0%; }
    @font-face { font-family: 'Calibre Fallback'; font-weight: 600 900; src: local('Arial Bold'), local('Arial-BoldMT'), local('Liberation Sans Bold'), local('Helvetica Neue Bold'), local('Roboto Bold'); size-adjust: 84%; ascent-override: 77.38%; descent-override: 41.67%; line-gap-override: 0%; }
    @font-face { font-family: 'SF Mono Fallback'; src: local('Courier New'), local('CourierNewPSMT'), local('Liberation Mono'), local('Menlo'); size-adjust: 103%; ascent-override: 92.2%; descent-override: 23.3%; line-gap-override: 0%; }
  </style>
</head>
<body>
  <app-root></app-root>
  <noscript>
    <p style="color:#ccd6f6;font-family:sans-serif;padding:24px">
      Chirag Jain – Assistant Vice President at Delta Capita. Reach me at
      <a href="mailto:chirag8966@gmail.com" style="color:#64ffda">chirag8966@gmail.com</a>,
      <a href="https://www.linkedin.com/in/chirag8966/" style="color:#64ffda">LinkedIn</a> or
      <a href="https://github.com/chirag8966" style="color:#64ffda">GitHub</a>.
    </p>
  </noscript>
</body>
</html>
