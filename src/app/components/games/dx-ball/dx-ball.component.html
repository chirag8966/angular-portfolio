<section class="section game-section" aria-labelledby="game-heading">
  <div class="container">
    <div class="game-header">
      <p class="game-pretitle">{{ 'dxBall.pretitle' | translate }}</p>
      <h2 id="game-heading" class="game-heading">{{ 'dxBall.heading' | translate }}</h2>
      <p class="game-description">{{ 'dxBall.description' | translate }}</p>
    </div>

    <div class="game-frame">
      <canvas #gameCanvas aria-label="DX-Ball mini game" role="img"></canvas>
    </div>

    <div class="game-controls">
      <button type="button" class="main-btn" (click)="restartGame()">
        {{ 'dxBall.restartButton' | translate }}
      </button>
    </div>
  </div>
</section>
