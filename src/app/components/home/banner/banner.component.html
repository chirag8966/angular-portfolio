<section class="section banner">
    <div class="container">
        <div class="section-box-banner">
            <div class="content">
                <p class="banner-pretitle">{{"Banner.Pretitle" | translate}}</p>
                <div class='banner-title'>
                    <h1>Chirag <span class="colorGreen">J</span>ain.</h1>
                    <p class="banner-role">Assistant Vice President <span class="banner-at">&#64;</span> Delta Capita</p>
                </div>
                <div class='banner-description'>
                    <p [innerHTML]='"Banner.Description" | translate | years' class="mt-4"></p>
                </div>
            </div>
            <div class="div-btn-banner">
                <a href="assets/cv/resume.pdf" target="_blank" rel="noopener" (click)='analyticsService.sendAnalyticEvent("click_Download_Resume", "banner", "download")' class="main-btn">
                    Resume
                </a>
                <a (click)='analyticsService.sendAnalyticEvent("click_send_mail", "banner", "email")' href="mailto:chirag8966@gmail.com" class="main-btn">
                    {{"Banner.ActionBtn" | translate}}
                </a>
            </div>
        </div>
    </div>
</section>
