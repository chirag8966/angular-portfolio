# This is a basic workflow to help you get started with Actions

name: deploy portfolio to s3

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: main

env:
  BUCKET_NAME: "chiragjain.pro"
  AWS_REGION: "us-east-1"
  AWS_CLOUDFRONT_DISTRIBUTION_ID: "E2IVJT1UVKO29P"
  AWS_ACCOUNT_ID: "858098074775"

permissions:
  id-token: write
  contents: read

jobs:
  S3PackageUpload:
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GithubS3Access
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: npm ci

      - name: Build the project
        run: npm run build-portfolio

      - name: Sync hashed assets to S3 bucket
        run: |
          aws s3 sync ./dist/chiragjain-portfolio/browser s3://${{ env.BUCKET_NAME }}/ --delete \
            --exclude "index.html" --exclude "assets/i18n/*" --exclude "robots.txt" --exclude "sitemap.xml" --exclude "manifest.webmanifest" --exclude "ngsw.json" --exclude "ngsw-worker.js" --exclude "safety-worker.js" --exclude "worker-basic.min.js" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload entry files with no-cache
        run: |
          aws s3 sync ./dist/chiragjain-portfolio/browser s3://${{ env.BUCKET_NAME }}/ \
            --exclude "*" --include "index.html" --include "assets/i18n/*" --include "robots.txt" --include "sitemap.xml" --include "manifest.webmanifest" --include "ngsw.json" --include "ngsw-worker.js" --include "safety-worker.js" --include "worker-basic.min.js" \
            --cache-control "no-cache"

      - name: cache invalidation
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ env.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"